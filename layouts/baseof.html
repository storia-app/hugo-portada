<!doctype html>
<html lang="{{ site.Language.Locale }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
    <link rel="canonical" href="{{ .Permalink }}">
    <link rel="icon" href="{{ "favicon.svg" | absURL }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ "style.css" | absURL }}">
    {{ with site.Home.OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" title="{{ site.Title }}" href="{{ .Permalink }}">{{ end }}
    <script>
      (function () {
        try {
          var s = localStorage.getItem("theme");
          var d = s ? s === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = d ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="site-title" href="{{ site.Home.Permalink }}">{{ site.Title }}</a>
        <nav class="site-nav">
          <a href="{{ site.Home.Permalink }}">Inicio</a>
          <a href="{{ "tags/" | absURL }}">Tags</a>
          {{ with site.Home.OutputFormats.Get "rss" }}<a href="{{ .Permalink }}">RSS</a>{{ end }}
          <button class="theme-toggle" type="button" aria-label="Cambiar tema" id="theme-toggle">◐</button>
        </nav>
      </div>
    </header>
    <main>
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="site-footer">
      <div class="wrap">© {{ now.Year }} {{ site.Params.author }} · Hecho con Storia</div>
    </footer>
    <script>
      document.getElementById("theme-toggle").addEventListener("click", function () {
        var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem("theme", next); } catch (e) {}
      });
    </script>
  </body>
</html>
